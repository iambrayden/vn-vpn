<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="/"><span class="dot"></span>{{ brand }}</a>
  {% if user %}
  <nav>
    <a href="/portal">My VPN</a>
    {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
    <span class="muted">{{ user.email }}</span>
    <form method="post" action="/logout"><button class="link">Log out</button></form>
  </nav>
  {% endif %}
</header>
<main>
  {% for kind, msg in flashes %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
