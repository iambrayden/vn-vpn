# Coolify: create a new resource -> "Docker Compose" from this repo, set the env vars below,
# and attach your domain to the "panel" service (port 8000).
services:
  panel:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_PANEL_8000
      - PUBLIC_URL=${SERVICE_FQDN_PANEL}
      - SECRET_KEY=${SERVICE_PASSWORD_64_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?set ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      - BRAND_NAME=${BRAND_NAME:-VN-VPN}
      - OPEN_SIGNUP=${OPEN_SIGNUP:-true}
      - PROVISION_API_KEY=${PROVISION_API_KEY:-}
      - VPN_SUBNET=${VPN_SUBNET:-10.66.0.0/16}
      - CLIENT_DNS=${CLIENT_DNS:-1.1.1.1, 1.0.0.1}
      # Billing (Stripe). Without these, plans show as "Coming soon" and admins can still grant plans manually.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_BASIC=${STRIPE_PRICE_BASIC:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - PLAN_BASIC_DEVICES=${PLAN_BASIC_DEVICES:-1}
      - PLAN_PRO_DEVICES=${PLAN_PRO_DEVICES:-5}
      # Monitoring & logging
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - LOG_SESSIONS=${LOG_SESSIONS:-true}
      - LOG_DESTINATIONS=${LOG_DESTINATIONS:-true}
      - SESSION_LOG_DAYS=${SESSION_LOG_DAYS:-30}
      - FLOW_LOG_DAYS=${FLOW_LOG_DAYS:-7}
      - METRICS_DAYS=${METRICS_DAYS:-7}
    volumes:
      - vnvpn-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vnvpn-data:
